<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修复后的 Mermaid 测试</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Inter, sans-serif;
      padding: 20px;
    }
    #chart {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      min-height: 400px;
    }
    #debug {
      background: #1e1e1e;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>修复后的 Mermaid 测试</h1>
  <button onclick="testFixedGeneration()">测试修复后的生成逻辑</button>
  <div id="debug"></div>
  <div id="chart"></div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
    });

    // 复制修复后的生成函数
    const generateMermaidDefinition = (mindmap) => {
      console.log('Generating mindmap definition for:', mindmap);

      // 确保数据结构正确
      if (!mindmap || !mindmap.root) {
        throw new Error('Invalid mindmap structure: missing root');
      }

      // 1. 处理根节点 (确保它是 root((内容)) 格式)
      let rootNode = mindmap.root;
      // 如果后端传来的 root 只是纯文字，包装它；如果是 root((...))，保持原样
      if (!rootNode.includes('((')) {
        rootNode = `root((${rootNode}))`;
      }

      console.log('Processed root node:', rootNode);

      let lines = ['mindmap', rootNode];

      // 递归处理节点
      const processNode = (nodes, level) => {
        const indent = '  '.repeat(level);

        nodes.forEach((node, index) => {
          if (!node.name) return;

          // 【关键修复】：清洗节点名
          // 1. 将双引号转义或替换为单引号
          // 2. 移除节点名中可能存在的方括号 [ ]，防止解析错误
          let safeName = node.name
            .replace(/"/g, "'")    // 双引转单引
            .replace(/\[/g, "")    // 移除左中括号
            .replace(/\]/g, "");   // 移除右中括号

          console.log(`Processing node at level ${level}: "${node.name}" -> "${safeName}"`);

          // 3. 统一使用 ["内容"] 包裹，这是 Mermaid 处理特殊字符最安全的方式
          lines.push(`${indent}["${safeName}"]`);

          if (node.children && Array.isArray(node.children)) {
            processNode(node.children, level + 1);
          }
        });
      };

      if (mindmap.children) {
        processNode(mindmap.children, 1);
      }

      const definition = lines.join('\n') + '\n';

      console.log('Final generated definition:', definition);
      return definition;
    };

    function testFixedGeneration() {
      const debugDiv = document.getElementById('debug');
      const chartDiv = document.getElementById('chart');

      // 模拟后端数据（包含有问题的特殊字符）
      const problematicData = {
        root: "root((Transformer 注意力机制))",
        children: [
          {
            name: "核心概念",
            children: [
              { name: 'Q - Query (查询): 当前要匹配的信息' },
              { name: 'K - Key (键): 用于被匹配的信息' },
              { name: 'V - Value (值): 最终提取的信息内容' },
              { name: '相似度度量: 计算 Q 与 K 的匹配程度' }
            ]
          },
          {
            name: "数学计算流程",
            children: [
              { name: 'Scaled Dot-Product Attention' },
              { name: '点积 (Dot Product): Q 乘以 K 的转置' },
              { name: '缩放 (Scaling): 除以 sqrt(dk) 防止梯度消失' },
              { name: '掩码 (Masking): 屏蔽未来信息 (Decoder)' },
              { name: '归一化 (Softmax): 转化为概率分布' },
              { name: '加权求和: 用概率对 V 进行加权综合' }
            ]
          },
          {
            name: "问题测试",
            children: [
              { name: '复杂度: ["O(n² · d) n为序列长度"]' },  // 这个有嵌套引号
              { name: '特殊字符: [测试] (括号)' }  // 这个有特殊符号
            ]
          }
        ]
      };

      try {
        // 生成 mermaid 定义
        const definition = generateMermaidDefinition(problematicData);

        // 显示调试信息
        debugDiv.textContent = '=== 后端原始数据 ===\n' + JSON.stringify(problematicData, null, 2) + '\n\n' +
                              '=== 生成的 Mermaid 定义 ===\n' + definition;

        // 尝试渲染
        const svgId = 'test-fixed-chart-' + Date.now();

        mermaid.render(svgId, definition)
          .then(result => {
            console.log('渲染成功！');
            console.log('Result type:', typeof result);
            console.log('Result length:', result.length);

            chartDiv.innerHTML = result;
            console.log('已添加到 chartDiv');

            // 检查是否真的添加了内容
            console.log('chartDiv children:', chartDiv.children.length);
            console.log('chartDiv HTML:', chartDiv.innerHTML.substring(0, 200) + '...');

            // 添加自定义样式
            const style = document.createElement('style');
            style.textContent = `
              .mermaid svg {
                background: transparent !important;
                width: 100% !important;
                height: auto !important;
              }
              .mermaid .node {
                filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)) !important;
              }
              .mermaid text {
                fill: #e2e8f0 !important;
                font-family: Inter, sans-serif !important;
              }
              .mermaid .mindmap {
                width: 100% !important;
                height: 500px !important;
              }
            `;
            chartDiv.appendChild(style);
            console.log('样式已添加');

            // 强制重绘
            chartDiv.style.display = 'none';
            chartDiv.offsetHeight; // 触发重排
            chartDiv.style.display = '';
          })
          .catch(error => {
            console.error('渲染失败:', error);
            chartDiv.innerHTML = `<p class="error">错误: ${error.message}</p>`;
            debugDiv.textContent += '\n\n=== 错误信息 ===\n' + error.message;
          });
      } catch (error) {
        console.error('生成失败:', error);
        chartDiv.innerHTML = `<p class="error">错误: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
