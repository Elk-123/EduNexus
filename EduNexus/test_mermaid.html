<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid API 测试</title>
  <style>
    body {
      padding: 20px;
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Inter, sans-serif;
    }
    #chart {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      min-height: 400px;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Mermaid API 测试</h1>
  <div id="chart">加载中...</div>

  <script type="module">
    const chart = document.getElementById('chart');

    const initAndRender = async () => {
      try {
        console.log('Importing mermaid...');
        const mermaidModule = await import('mermaid');
        const mermaid = mermaidModule.default;

        console.log('Initializing mermaid...');
        await mermaid.initialize({
          startOnLoad: false,
          theme: 'base',
          themeVariables: {
            background: 'transparent',
            primaryColor: '#3b82f6',
            primaryTextColor: '#ffffff',
            primaryBorderColor: '#3b82f6',
            lineColor: '#4b5563'
          }
        });

        const mindmapData = {
          root: 'root((Transformer 注意力机制))',
          children: [
            {
              name: '核心概念',
              children: [
                { name: 'Q - Query (查询): 当前要匹配的信息' },
                { name: 'K - Key (键): 用于被匹配的信息' },
                { name: 'V - Value (值): 最终提取的信息内容' }
              ]
            },
            {
              name: '数学计算流程',
              children: [
                { name: 'Scaled Dot-Product Attention' },
                { name: '点积 (Dot Product): Q 乘以 K 的转置' }
              ]
            }
          ]
        };

        const definition = generateMermaidDefinition(mindmapData);
        console.log('Definition:', definition);

        const svgId = 'test-chart-' + Date.now();
        console.log('Rendering with id:', svgId);

        const result = await mermaid.render(svgId, definition);
        console.log('Render result:', result);

        if (result && typeof result === 'string') {
          chart.innerHTML = result;
        } else if (result && result.svg) {
          chart.innerHTML = result.svg;
        } else {
          throw new Error('Unexpected result format');
        }
      } catch (error) {
        console.error('Error:', error);
        chart.innerHTML = `<p class="error">错误: ${error.message}</p>`;
      }
    };

    const generateMermaidDefinition = (mindmap) => {
      const root = mindmap.root;
      const children = mindmap.children || [];

      let definition = `mindmap\n  root ${root}\n`;

      children.forEach((child, index) => {
        definition += `  ${index + 1} ${child.name}\n`;

        if (child.children) {
          child.children.forEach((sub, subIndex) => {
            const subName = sub.name.includes(':') || sub.name.includes('"') ? `"${sub.name}"` : sub.name;
            definition += `    ${index + 1}.${subIndex + 1} ${subName}\n`;
          });
        }
      });

      return definition;
    };

    initAndRender();
  </script>
</body>
</html>
