<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单 Mermaid 测试</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Inter, sans-serif;
      padding: 20px;
    }
    #chart {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>简单 Mermaid 测试</h1>
  <button onclick="renderChart()">渲染图表</button>
  <div id="chart"></div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
    });

    function renderChart() {
      const chartElement = document.getElementById('chart');

      const definition = `mindmap
        root((Transformer 注意力机制))
          1 核心概念
            1.1 "Q - Query (查询)"
            1.2 "K - Key (键)"
          2 数学计算
            2.1 "Scaled Dot-Product"
            2.2 "Softmax"`;

      const svgId = 'simple-chart-' + Date.now();

      mermaid.render(svgId, definition)
        .then(result => {
          console.log('Render result:', result);
          chartElement.innerHTML = result;
        })
        .catch(error => {
          console.error('Error:', error);
          chartElement.innerHTML = '<p class="error">错误: ' + error.message + '</p>';
        });
    }
  </script>
</body>
</html>
