<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组件逻辑测试</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Inter, sans-serif;
      padding: 20px;
    }
    #mindmapRef {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      min-height: 500px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>组件逻辑测试</h1>
  <button onclick="simulateComponent()">模拟组件行为</button>
  <div id="mindmapRef"></div>

  <script>
    // 模拟 architectResource 数据
    const mockArchitectResource = {
      content: {
        mindmap: {
          root: 'root((Transformer 注意力机制))',
          children: [
            {
              name: '核心概念',
              children: [
                { name: 'Q - Query (查询): 当前要匹配的信息' },
                { name: 'K - Key (键): 用于被匹配的信息' },
                { name: 'V - Value (值): 最终提取的信息内容' },
                { name: '相似度度量: 计算 Q 与 K 的匹配程度' }
              ]
            },
            {
              name: '数学计算流程',
              children: [
                { name: 'Scaled Dot-Product Attention' },
                { name: '点积 (Dot Product): Q 乘以 K 的转置' },
                { name: '缩放 (Scaling): 除以 sqrt(dk) 防止梯度消失' },
                { name: '掩码 (Masking): 屏蔽未来信息 (Decoder)' },
                { name: '归一化 (Softmax): 转化为概率分布' },
                { name: '加权求和: 用概率对 V 进行加权综合' }
              ]
            },
            {
              name: '结构分类',
              children: [
                { name: '自注意力 Self-Attention' },
                { name: 'Encoder Self-Attention: 全向关注' },
                { name: 'Decoder Masked Self-Attention: 仅关注历史' },
                { name: '交叉注意力 Cross-Attention' },
                { name: 'Encoder-Decoder Attention: 建立编码与解码的联系' },
                { name: '多头注意力 Multi-Head Attention' },
                { name: '多空间表达: 线性变换到多个低维子空间' },
                { name: '并行计算: 增强模型捕捉多维度特征的能力' },
                { name: '拼接与融合: Concat & Linear' }
              ]
            },
            {
              name: '关键特性与优势',
              children: [
                { name: '并行性 Parallelism: 解决 RNN 无法并行的问题' },
                { name: '长程依赖 Long-range: 建模全局上下文' },
                { name: '动态权重: 根据输入内容实时计算相关性' },
                { name: '复杂度: ["O(n² · d) n为序列长度"]' }
              ]
            }
          ]
        }
      }
    };

    // 生成 mermaid 定义
    function generateMermaidDefinition(mindmap) {
      console.log('Generating mindmap definition for:', mindmap);

      // 确保数据结构正确
      if (!mindmap || !mindmap.root) {
        throw new Error('Invalid mindmap structure: missing root');
      }

      const root = mindmap.root;
      const children = Array.isArray(mindmap.children) ? mindmap.children : [];

      // 过滤无效的子节点
      const validChildren = children.filter(child =>
        child && typeof child === 'object' && typeof child.name === 'string' && child.name.trim() !== ''
      );

      console.log('Valid children:', validChildren);

      // 直接使用你验证成功的格式
      let definition = `mindmap\n  root${root}\n`;

      validChildren.forEach((child, index) => {
        console.log(`Processing child ${index}:`, child);

        // 确保 child.name 是字符串
        const childName = typeof child.name === 'string'
          ? child.name.includes(' ') || child.name.includes(':') || child.name.includes('-') || child.name.includes('(')
            ? `"${child.name}"`
            : child.name
          : `Invalid Node ${index}`;
        console.log(`Child name: "${childName}"`);
        definition += `    ${childName}\n`;

        // 处理二级子节点
        if (Array.isArray(child.children)) {
          const validSubChildren = child.children.filter(sub =>
            sub && typeof sub === 'object' && typeof sub.name === 'string' && sub.name.trim() !== ''
          );

          validSubChildren.forEach((sub, subIndex) => {
            console.log(`  Processing sub-child ${subIndex}:`, sub);

            const subName = typeof sub.name === 'string'
              ? sub.name.includes(' ') || sub.name.includes(':') || sub.name.includes('-') || sub.name.includes('(')
                ? `"${sub.name}"`
                : sub.name
              : `Invalid Sub Node ${subIndex}`;
            console.log(`  Sub name: "${subName}"`);
            definition += `      ${subName}\n`;

            // 处理三级子节点
            if (Array.isArray(sub.children)) {
              const validGrandChildren = sub.children.filter(grandChild =>
                grandChild && typeof grandChild === 'object' && typeof grandChild.name === 'string' && grandChild.name.trim() !== ''
              );

              validGrandChildren.forEach((grandChild, grandChildIndex) => {
                console.log(`    Processing grand-child ${grandChildIndex}:`, grandChild);

                const grandChildName = typeof grandChild.name === 'string'
                  ? grandChild.name.includes(' ') || grandChild.name.includes(':') || grandChild.name.includes('-') || grandChild.name.includes('(')
                    ? `"${grandChild.name}"`
                    : grandChild.name
                  : `Invalid Grand Child ${grandChildIndex}`;
                console.log(`    Grand child name: "${grandChildName}"`);
                definition += `        ${grandChildName}\n`;
              });
            }
          });
        }
      });

      // 调试输出
      console.log('\nFinal mermaid definition:');
      console.log(definition);
      console.log('--- End of definition ---\n');

      return definition;
    }

    // 模拟组件行为
    async function simulateComponent() {
      const mindmapRef = document.getElementById('mindmapRef');

      try {
        console.log('Starting mermaid import...');

        // 清空容器
        mindmapRef.innerHTML = '';

        // 初始化 mermaid
        await window.mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
        });
        console.log('Mermaid initialized');

        // 生成 mermaid 图表定义
        const chartDefinition = generateMermaidDefinition(mockArchitectResource.content.mindmap);
        console.log('Chart definition:', chartDefinition);

        // 也输出原始数据
        console.log('Original mindmap:', mockArchitectResource.content.mindmap);

        // 使用 mermaid 渲染
        const svgId = 'mindmap-chart-' + Date.now();
        console.log('Rendering with id:', svgId);

        const result = await window.mermaid.render(svgId, chartDefinition);
        console.log('Mermaid render result type:', typeof result);

        if (typeof result === 'string') {
          mindmapRef.innerHTML = result;

          // 添加自定义样式
          const style = document.createElement('style');
          style.textContent = `
            .mermaid svg {
              background: transparent !important;
              width: 100% !important;
              height: auto !important;
            }
            .mermaid .node {
              filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)) !important;
            }
            .mermaid .edge {
              stroke: #4b5563 !important;
            }
            .mermaid text {
              fill: #e2e8f0 !important;
              font-family: Inter, sans-serif !important;
            }
          `;
          mindmapRef.appendChild(style);
          console.log('Mindmap rendered successfully');
        } else {
          throw new Error('Expected string from mermaid.render');
        }
      } catch (error) {
        console.error('Mermaid rendering failed:', error);
        mindmapRef.innerHTML = `<p class="text-red-500">图表渲染失败: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
