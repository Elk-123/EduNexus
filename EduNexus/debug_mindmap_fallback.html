<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思维导图备选方案</title>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Inter, sans-serif;
      padding: 20px;
    }
    .mindmap {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .root {
      font-size: 1.5em;
      font-weight: bold;
      color: #3b82f6;
      margin-bottom: 20px;
      text-align: center;
    }
    .branch {
      margin-left: 20px;
    }
    .node {
      background: #2a2a2a;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 5px 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .node:hover {
      background: #3b82f6;
      color: #ffffff;
      transform: translateX(5px);
    }
    .sub-node {
      margin-left: 20px;
      margin-top: 5px;
    }
    .sub-node .node {
      font-size: 0.9em;
      background: #252525;
      border-color: #6b7280;
    }
    .sub-node .node:hover {
      background: #6b7280;
    }
    details {
      margin: 10px 0;
    }
    summary {
      cursor: pointer;
      font-weight: 500;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <h1>思维导图备选方案</h1>
  <button onclick="renderMindmap()">渲染思维导图</button>

  <div class="mindmap" id="mindmapContainer">
    <!-- 思维导图将在这里渲染 -->
  </div>

  <script>
    // 模拟后端数据
    const mindmapData = {
      root: 'root((Transformer 注意力机制))',
      children: [
        {
          name: '核心概念',
          children: [
            { name: 'Q - Query (查询): 当前要匹配的信息' },
            { name: 'K - Key (键): 用于被匹配的信息' },
            { name: 'V - Value (值): 最终提取的信息内容' },
            { name: '相似度度量: 计算 Q 与 K 的匹配程度' }
          ]
        },
        {
          name: '数学计算流程',
          children: [
            { name: 'Scaled Dot-Product Attention' },
            { name: '点积 (Dot Product): Q 乘以 K 的转置' },
            { name: '缩放 (Scaling): 除以 sqrt(dk) 防止梯度消失' },
            { name: '掩码 (Masking): 屏蔽未来信息 (Decoder)' },
            { name: '归一化 (Softmax): 转化为概率分布' },
            { name: '加权求和: 用概率对 V 进行加权综合' }
          ]
        }
      ]
    };

    function renderMindmap() {
      const container = document.getElementById('mindmapContainer');

      // 提取根节点名称（去掉 root((...)) 的包装）
      const rootName = mindmapData.root.replace('root((', '').replace('))', '');

      let html = `<div class="root">${rootName}</div>`;

      mindmapData.children.forEach(child => {
        html += `
          <details>
            <summary class="node">${child.name}</summary>
            <div class="sub-node">
        `;

        if (child.children) {
          child.children.forEach(subChild => {
            html += `<div class="node">${subChild.name}</div>`;
          });
        }

        html += `
            </div>
          </details>
        `;
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
