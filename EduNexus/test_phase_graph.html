<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>测试阶段图谱</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0b0b0b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      display: flex;
      height: 100vh;
      gap: 20px;
    }
    .left-panel {
      flex: 1;
      background-color: #0d0d0d;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .right-panel {
      width: 380px;
      background-color: #0d0d0d;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .phase-card {
      background-color: #141414;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .phase-card:hover {
      border-color: #3b82f6;
    }
    .phase-card.active {
      background-color: rgba(59, 130, 246, 0.1);
      border-color: #3b82f6;
    }
    .phase-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #60a5fa;
    }
    .phase-desc {
      font-size: 14px;
      color: #999;
    }
    #graph-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h2 style="margin-top: 0;">智能路径规划引擎</h2>
      <div id="graph-container">
        <!-- SVG 图谱将在这里渲染 -->
      </div>
    </div>

    <div class="right-panel">
      <h3 style="margin-top: 0;">学习路径</h3>

      <div class="phase-card" onclick="selectPhase('phase1')">
        <div class="phase-title">第一阶段：基础储备</div>
        <div class="phase-desc">数学基础、编程开发、Python核心语法</div>
      </div>

      <div class="phase-card" onclick="selectPhase('phase2')">
        <div class="phase-title">第二阶段：核心模型</div>
        <div class="phase-desc">经典机器学习、计算机视觉、自然语言处理</div>
      </div>

      <div class="phase-card" onclick="selectPhase('phase3')">
        <div class="phase-title">第三阶段：前沿进阶</div>
        <div class="phase-desc">Transformer架构、大语言模型原理</div>
      </div>
    </div>
  </div>

  <script>
    let selectedPhase = null;

    function selectPhase(phase) {
      selectedPhase = phase;

      // 更新卡片样式
      document.querySelectorAll('.phase-card').forEach(card => {
        card.classList.remove('active');
      });
      event.target.closest('.phase-card').classList.add('active');

      // 渲染对应的图谱
      renderGraph(phase);
    }

    function renderGraph(phase) {
      const container = document.getElementById('graph-container');

      if (!phase) {
        // 显示总览
        container.innerHTML = `
          <svg width="700" height="450" viewBox="0 0 700 450">
            <!-- 第一阶段 -->
            <rect x="50" y="100" width="200" height="280" rx="10" fill="#0f172a" stroke="#334155"/>
            <text x="150" y="130" text-anchor="middle" fill="#60a5fa" font-size="16">第一阶段：基础储备</text>
            <rect x="70" y="150" width="160" height="30" rx="5" fill="#1e293b" stroke="#475569"/>
            <text x="150" y="170" text-anchor="middle" fill="#fff" font-size="12">数学基础</text>

            <!-- 第二阶段 -->
            <rect x="275" y="100" width="200" height="280" rx="10" fill="#0f172a" stroke="#3730a3"/>
            <text x="375" y="130" text-anchor="middle" fill="#60a5fa" font-size="16">第二阶段：核心模型</text>
            <rect x="295" y="150" width="160" height="30" rx="5" fill="#1e293b" stroke="#475569"/>
            <text x="375" y="170" text-anchor="middle" fill="#fff" font-size="12">机器学习</text>

            <!-- 第三阶段 -->
            <rect x="500" y="100" width="200" height="280" rx="10" fill="#0f172a" stroke="#7c3aed"/>
            <text x="600" y="130" text-anchor="middle" fill="#60a5fa" font-size="16">第三阶段：前沿进阶</text>
            <rect x="520" y="150" width="160" height="30" rx="5" fill="#1e293b" stroke="#475569"/>
            <text x="600" y="170" text-anchor="middle" fill="#fff" font-size="12">Transformer</text>

            <!-- 连接线 -->
            <path d="M 250 240 L 275 240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
            <path d="M 475 240 L 500 240" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
          </svg>
        `;
      } else {
        // 显示详细阶段
        const phaseData = {
          phase1: {
            name: '基础储备',
            nodes: ['数学基础', '编程开发', 'Python核心语法', '线性代数', '微积分']
          },
          phase2: {
            name: '核心模型',
            nodes: ['经典机器学习', '监督学习', '无监督学习', '深度学习', '计算机视觉']
          },
          phase3: {
            name: '前沿进阶',
            nodes: ['Transformer架构', '大语言模型', 'RAG检索', 'LoRA微调', 'MLOps']
          }
        };

        const data = phaseData[phase];
        let svg = `
          <svg width="750" height="500" viewBox="0 0 750 500">
            <text x="375" y="40" text-anchor="middle" fill="#60a5fa" font-size="20" font-weight="bold">${data.name}学习路径</text>

            <!-- 开始节点 -->
            <rect x="50" y="100" width="120" height="40" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
            <text x="110" y="125" text-anchor="middle" fill="#60a5fa" font-size="14">开始学习</text>
        `;

        // 添加节点
        data.nodes.forEach((node, index) => {
          const y = 180 + index * 60;
          svg += `
            <rect x="50" y="${y}" width="200" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
            <text x="150" y="${y + 25}" text-anchor="middle" fill="#fff" font-size="14">${node}</text>
          `;
        });

        // 添加结束节点
        const endY = 180 + data.nodes.length * 60;
        svg += `
            <rect x="50" y="${endY}" width="120" height="40" rx="20" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
            <text x="110" y="${endY + 25}" text-anchor="middle" fill="#22c55e" font-size="14">阶段完成</text>

            <!-- 连接线 -->
            <path d="M 170 120 L 170 180" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
        `;

        // 节点间连接
        for (let i = 0; i < data.nodes.length - 1; i++) {
          const y1 = 200 + i * 60;
          const y2 = 240 + i * 60;
          svg += `
            <path d="M 250 ${y1 + 20} L 250 ${y2} L 50 ${y2} L 50 ${200 + (i + 1) * 60}" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
          `;
        }

        // 添加分支（如果是第二或第三阶段）
        if (phase === 'phase2') {
          svg += `
            <text x="350" y="200" fill="#60a5fa" font-size="14">专业方向</text>
            <rect x="350" y="220" width="120" height="35" rx="5" fill="#1e293b" stroke="#3b82f6"/>
            <text x="410" y="242" text-anchor="middle" fill="#fff" font-size="12">计算机视觉</text>
            <rect x="350" y="265" width="120" height="35" rx="5" fill="#1e293b" stroke="#3b82f6"/>
            <text x="410" y="287" text-anchor="middle" fill="#fff" font-size="12">自然语言处理</text>
          `;
        } else if (phase === 'phase3') {
          svg += `
            <text x="350" y="200" fill="#60a5fa" font-size="14">应用方向</text>
            <rect x="350" y="220" width="120" height="35" rx="5" fill="#1e293b" stroke="#7c3aed"/>
            <text x="410" y="242" text-anchor="middle" fill="#fff" font-size="12">RAG检索增强</text>
            <rect x="350" y="265" width="120" height="35" rx="5" fill="#1e293b" stroke="#7c3aed"/>
            <text x="410" y="287" text-anchor="middle" fill="#fff" font-size="12">LoRA/PEFT微调</text>
          `;
        }

        svg += `
          </svg>
        `;

        container.innerHTML = svg;
      }
    }

    // 初始渲染总览
    renderGraph(null);
  </script>
</body>
</html>
