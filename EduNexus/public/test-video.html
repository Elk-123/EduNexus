<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频资源测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0b0b0b;
      font-family: 'Inter', sans-serif;
    }

    /* 文本截断样式 */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="text-slate-200">
  <div class="container mx-auto px-4 py-8 max-w-7xl">
    <h1 class="text-3xl font-bold text-white mb-8">视频资源测试页面</h1>

    <div id="video-container"></div>
  </div>

  <script>
    // 模拟从后端获取的视频资源数据（已调整为3个视频）
    const mockVideoData = {
      "scenes": [
        {
          "scene_number": 1,
          "title": "Transformer注意力机制详解",
          "visual": "动画展示注意力权重如何分布",
          "voiceover": "想象我们在读一个句子时，我们会自然地关注到与当前词最相关的词...",
          "duration_seconds": 45,
          "resources": [
            {
              "type": "video",
              "title": "Transformer注意力机制详解",
              "description": "深入理解Transformer架构中的核心机制，包括自注意力、缩放点积注意力和多头注意力的工作原理",
              "thumbnail": "https://img.youtube.com/vi/eMlx5fFNoYc/maxresdefault.jpg",
              "url": "https://www.youtube.com/watch?v=eMlx5fFNoYc",
              "duration": "15:32",
              "platform": "YouTube"
            }
          ]
        },
        {
          "scene_number": 2,
          "title": "QKV机制可视化教程",
          "visual": "三栏对比展示Q、K、V的作用",
          "voiceover": "Query就像是当前词的问题，Key是所有词的标签，Value是所有词的内容...",
          "duration_seconds": 60,
          "resources": [
            {
              "type": "video",
              "title": "QKV机制可视化教程",
              "description": "通过动画直观理解Query-Key-Value的工作原理，以及它们如何协同计算注意力权重",
              "thumbnail": "https://img.zcool.cn/community/03158e5d1b26e1a801215a95a458e7.jpg",
              "url": "https://www.bilibili.com/video/BV1v34y1x7h8",
              "duration": "12:45",
              "platform": "B站"
            }
          ]
        },
        {
          "scene_number": 3,
          "title": "多头注意力实战应用",
          "visual": "动画展示多个并行头的注意力计算",
          "voiceover": "每个头就像一个专家，从不同角度理解词之间的关系...",
          "duration_seconds": 75,
          "resources": [
            {
              "type": "video",
              "title": "多头注意力实战应用",
              "description": "深入理解多头注意力的并行计算原理，以及在BERT和GPT等模型中的实际应用",
              "thumbnail": "https://img.zcool.cn/community/03158e5d1b26e1a801215a95a458e7.jpg",
              "url": "https://www.bilibili.com/video/BV1v34y1x7h9",
              "duration": "18:20",
              "platform": "B站"
            }
          ]
        }
      ]
    };

    // 渲染视频列表 - 简化版本
    function renderVideos() {
      const container = document.getElementById('video-container');

      // 直接展示所有视频，不按场景分组
      const allVideos = [];
      mockVideoData.scenes.forEach(scene => {
        if (scene.resources) {
          scene.resources.forEach(video => {
            allVideos.push({
              ...video,
              sceneTitle: scene.title,
              sceneNumber: scene.scene_number
            });
          });
        }
      });

      if (allVideos.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-slate-500">
            <svg class="h-12 w-12 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <p>暂无视频资源</p>
          </div>
        `;
        return;
      }

      // 创建标题
      const title = document.createElement('h2');
      title.className = 'text-2xl font-bold text-white mb-6';
      title.textContent = '视频教程';
      container.appendChild(title);

      // 渲染每个视频
      allVideos.forEach((video, index) => {
        const videoCard = document.createElement('div');
        videoCard.className = 'group';

        videoCard.innerHTML = `
          <!-- 视频卡片 -->
          <div class="bg-white/5 rounded-2xl overflow-hidden border border-white/10 hover:border-blue-500/30 transition-all hover:shadow-xl hover:shadow-blue-500/10 mb-6">
            <!-- 视频封面 - 可点击 -->
            <div class="relative aspect-video bg-black/40 overflow-hidden cursor-pointer"
                 onclick="window.open('${video.url}', '_blank')"
                 style="transition: transform 0.3s ease;">
              <img src="${video.thumbnail}" alt="${video.title}"
                   class="w-full h-full object-cover"
                   onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTggMTZWN0M1IDE5Ljc1IDIwLjY1IDUgMTYgNEM2IDI5LjIxIDAgNCAyLjIxIDRDNC44NSAxNiAxNCAxOS41NSAxNCAxNlYxNloiIGZpbGw9IiM0NDQ0NDQiLz4KPC9zdmc+'}">
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40"></div>

              <!-- 悬停时显示播放按钮 -->
              <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <button class="h-16 w-16 rounded-full bg-blue-600/90 hover:bg-blue-500 text-white shadow-lg hover:scale-110 transition-all duration-300">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                </button>
              </div>

              <!-- 时长标签 -->
              <div class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-md px-2 py-1 rounded text-white text-xs">
                ${video.duration}
              </div>

              <!-- 平台标签 -->
              <div class="absolute top-3 left-3 px-2 py-1 bg-blue-500/20 text-blue-400 rounded text-xs">
                ${video.platform}
              </div>
            </div>

            <!-- 视频信息 -->
            <div class="p-4">
              <h5 class="font-semibold text-white mb-2 line-clamp-2">${video.title}</h5>
              <p class="text-slate-400 text-sm line-clamp-2">${video.description}</p>
            </div>
          </div>
        `;

        container.appendChild(videoCard);

        // 添加动画
        setTimeout(() => {
          videoCard.style.opacity = '1';
          videoCard.style.transform = 'translateY(0)';
        }, 50 + index * 100);
      });
    }

    // 页面加载完成后渲染
    document.addEventListener('DOMContentLoaded', renderVideos);
  </script>
</body>
</html>
