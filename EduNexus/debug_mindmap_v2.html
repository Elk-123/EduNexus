<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindmap 数据调试</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Inter, sans-serif;
      padding: 20px;
    }
    #chart {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      min-height: 400px;
    }
    #debug {
      background: #1e1e1e;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Mindmap 数据调试</h1>
  <button onclick="testRealData()">测试真实的后端数据</button>
  <button onclick="testSimpleData()">测试简单数据</button>
  <div id="debug"></div>
  <div id="chart"></div>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
    });

    // 模拟真实的后端数据
    const realArchitectData = {
      root: 'root((Transformer 注意力机制))',
      children: [
        {
          name: '核心概念',
          children: [
            { name: 'Q - Query (查询): 当前要匹配的信息' },
            { name: 'K - Key (键): 用于被匹配的信息' },
            { name: 'V - Value (值): 最终提取的信息内容' },
            { name: '相似度度量: 计算 Q 与 K 的匹配程度' }
          ]
        },
        {
          name: '数学计算流程',
          children: [
            { name: 'Scaled Dot-Product Attention' },
            { name: '点积 (Dot Product): Q 乘以 K 的转置' },
            { name: '缩放 (Scaling): 除以 sqrt(dk) 防止梯度消失' },
            { name: '掩码 (Masking): 屏蔽未来信息 (Decoder)' },
            { name: '归一化 (Softmax): 转化为概率分布' },
            { name: '加权求和: 用概率对 V 进行加权综合' }
          ]
        },
        {
          name: '结构分类',
          children: [
            { name: '自注意力 Self-Attention' },
            { name: 'Encoder Self-Attention: 全向关注' },
            { name: 'Decoder Masked Self-Attention: 仅关注历史' },
            { name: '交叉注意力 Cross-Attention' },
            { name: 'Encoder-Decoder Attention: 建立编码与解码的联系' },
            { name: '多头注意力 Multi-Head Attention' },
            { name: '多空间表达: 线性变换到多个低维子空间' },
            { name: '并行计算: 增强模型捕捉多维度特征的能力' },
            { name: '拼接与融合: Concat & Linear' }
          ]
        },
        {
          name: '关键特性与优势',
          children: [
            { name: '并行性 Parallelism: 解决 RNN 无法并行的问题' },
            { name: '长程依赖 Long-range: 建模全局上下文' },
            { name: '动态权重: 根据输入内容实时计算相关性' },
            { name: '复杂度: ["O(n² · d) n为序列长度"]' }
          ]
        }
      ]
    };

    function testRealData() {
      const debugDiv = document.getElementById('debug');
      const chartDiv = document.getElementById('chart');

      console.log('Testing real architect data...');
      console.log('Data structure:', JSON.stringify(realArchitectData, null, 2));

      // 1. 测试数据结构
      const mindmap = realArchitectData;
      debugDiv.textContent = '=== 原始数据 ===\n' + JSON.stringify(mindmap, null, 2) + '\n\n';

      // 2. 测试生成定义
      const definition = generateMermaidDefinition(mindmap);
      debugDiv.textContent += '=== 生成的 Mermaid 定义 ===\n' + definition + '\n\n';

      // 3. 渲染
      mermaid.render('real-data-chart', definition)
        .then(result => {
          chartDiv.innerHTML = result;
          // 添加自定义样式
          const style = document.createElement('style');
          style.textContent = `
            .mermaid svg {
              background: transparent !important;
              width: 100% !important;
              height: auto !important;
            }
            .mermaid .node {
              filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)) !important;
            }
            .mermaid text {
              fill: #e2e8f0 !important;
              font-family: Inter, sans-serif !important;
            }
          `;
          chartDiv.appendChild(style);
        })
        .catch(error => {
          console.error('Error:', error);
          chartDiv.innerHTML = '<p class="error">错误: ' + error.message + '</p>';
          debugDiv.textContent += '=== 错误信息 ===\n' + error.message + '\n\n';
        });
    }

    function testSimpleData() {
      const debugDiv = document.getElementById('debug');
      const chartDiv = document.getElementById('chart');

      // 最简单的 mindmap 结构
      const simpleMindmap = {
        root: 'root((Root Node))',
        children: [
          {
            name: 'Child 1',
            children: [
              { name: 'Subchild 1.1' },
              { name: 'Subchild 1.2' }
            ]
          },
          {
            name: 'Child 2',
            children: [
              { name: 'Subchild 2.1' },
              { name: 'Subchild 2.2' }
            ]
          }
        ]
      };

      debugDiv.textContent = '=== 简单数据 ===\n' + JSON.stringify(simpleMindmap, null, 2) + '\n\n';

      const definition = generateMermaidDefinition(simpleMindmap);
      debugDiv.textContent += '=== 生成的 Mermaid 定义 ===\n' + definition + '\n\n';

      mermaid.render('simple-data-chart', definition)
        .then(result => {
          chartDiv.innerHTML = result;
        })
        .catch(error => {
          console.error('Error:', error);
          chartDiv.innerHTML = '<p class="error">错误: ' + error.message + '</p>';
        });
    }

    function generateMermaidDefinition(mindmap) {
      console.log('Generating definition for:', mindmap);

      // 确保数据结构正确
      if (!mindmap || !mindmap.root) {
        throw new Error('Invalid mindmap structure: missing root');
      }

      const root = mindmap.root;
      const children = Array.isArray(mindmap.children) ? mindmap.children : [];

      // 过滤无效的子节点
      const validChildren = children.filter(child =>
        child && typeof child === 'object' && child.name && typeof child.name === 'string' && child.name.trim() !== ''
      );

      console.log('Valid children:', validChildren.map(c => c.name));

      // 生成定义 - 注意：root 已经包含 "root((...))"，不需要再加 "root"
      let definition = `mindmap\n${root}\n`;

      validChildren.forEach((child) => {
        // 所有带特殊字符的都用引号包裹
        const childName = `"${child.name}"`;
        definition += `  ${childName}\n`;

        if (Array.isArray(child.children)) {
          child.children.forEach((sub) => {
            if (sub && typeof sub === 'object' && sub.name && typeof sub.name === 'string' && sub.name.trim() !== '') {
              const subName = `"${sub.name}"`;
              definition += `    ${subName}\n`;
            }
          });
        }
      });

      console.log('Generated definition:', definition);
      return definition;
    }
  </script>
</body>
</html>
