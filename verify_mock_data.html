<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直接API测试</title>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #60a5fa;
      margin-bottom: 20px;
    }
    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #374151;
      padding-bottom: 10px;
    }
    .tab-button {
      background: none;
      border: none;
      color: #9ca3af;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s;
    }
    .tab-button:hover {
      color: #e2e8f0;
      background-color: #1f2937;
    }
    .tab-button.active {
      color: #60a5fa;
      background-color: #1e40af;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .resource-card {
      background-color: #141414;
      border: 1px solid #303134;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .resource-title {
      color: #60a5fa;
      font-size: 24px;
      margin-bottom: 15px;
    }
    .resource-section {
      margin-bottom: 20px;
    }
    .resource-section h3 {
      color: #fbbf24;
      margin-bottom: 10px;
      font-size: 18px;
    }
    .resource-section p {
      color: #d1d5db;
      line-height: 1.6;
    }
    .video-item {
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .video-info h4 {
      color: #e2e8f0;
      margin-bottom: 5px;
    }
    .video-info p {
      color: #9ca3af;
      font-size: 14px;
    }
    .video-link {
      background-color: #3b82f6;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.3s;
    }
    .video-link:hover {
      background-color: #2563eb;
    }
    .code-block {
      background-color: #1e1e1e;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 15px;
      overflow-x: auto;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .quiz-item {
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .quiz-question {
      color: #e2e8f0;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .quiz-option {
      background-color: #334155;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 5px 0;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .quiz-option:hover {
      background-color: #475569;
    }
    .quiz-explanation {
      color: #60a5fa;
      margin-top: 10px;
      font-style: italic;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    .error {
      color: #ef4444;
      background-color: #7f1d1d;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 20px;
    }
    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <h1>EduNexus 内容工厂 - 直接API测试</h1>

  <button onclick="loadData()">加载 Transformer 注意机制数据</button>

  <div id="loadingState" class="loading" style="display: none;">
    正在加载数据...
  </div>

  <div id="errorState" class="error" style="display: none;"></div>

  <div id="dataContainer" style="display: none;">
    <div class="tab-container">
      <button class="tab-button active" onclick="showTab('professor')">教授文档</button>
      <button class="tab-button" onclick="showTab('mindmap')">思维导图</button>
      <button class="tab-button" onclick="showTab('quiz')">测验题目</button>
      <button class="tab-button" onclick="showTab('video')">视频资源</button>
      <button class="tab-button" onclick="showTab('code')">代码实验</button>
    </div>

    <!-- 教授文档 -->
    <div id="professor" class="tab-content active">
      <div class="resource-card">
        <h2 class="resource-title" id="professorTitle"></h2>
        <div id="professorSections"></div>
      </div>
    </div>

    <!-- 思维导图 -->
    <div id="mindmap" class="tab-content">
      <div class="resource-card">
        <h2 class="resource-title" id="mindmapTitle"></h2>
        <div id="mindmapContent"></div>
      </div>
    </div>

    <!-- 测验题目 -->
    <div id="quiz" class="tab-content">
      <div class="resource-card">
        <h2 class="resource-title">知识测验</h2>
        <div id="quizContent"></div>
      </div>
    </div>

    <!-- 视频资源 -->
    <div id="video" class="tab-content">
      <div class="resource-card">
        <h2 class="resource-title">视频教程</h2>
        <div id="videoContent"></div>
      </div>
    </div>

    <!-- 代码实验 -->
    <div id="code" class="tab-content">
      <div class="resource-card">
        <h2 class="resource-title" id="codeTitle"></h2>
        <p id="codeDescription"></p>
        <div class="resource-section">
          <h3>完整代码</h3>
          <pre id="codeContent" class="code-block"></pre>
        </div>
        <div class="resource-section">
          <h3>预期输出</h3>
          <pre id="codeOutput" class="code-block"></pre>
        </div>
        <div class="resource-section">
          <h3>扩展练习</h3>
          <ul id="codeExercises"></ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    let authToken = '';
    let currentData = null;

    async function loadData() {
      const loading = document.getElementById('loadingState');
      const error = document.getElementById('errorState');
      const container = document.getElementById('dataContainer');

      loading.style.display = 'block';
      error.style.display = 'none';
      container.style.display = 'none';

      try {
        // 1. 获取token
        const loginResponse = await fetch('http://localhost:8001/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'test@edunexus.com', password: '123456' })
        });

        if (!loginResponse.ok) {
          throw new Error('登录失败');
        }

        const loginData = await loginResponse.json();
        authToken = loginData.access_token;

        // 2. 获取最新任务ID
        const latestTaskResponse = await fetch('http://localhost:8001/api/v1/factory/latest', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!latestTaskResponse.ok) {
          throw new Error('获取最新任务失败');
        }

        const latestTask = await latestTaskResponse.json();
        console.log('最新任务:', latestTask);

        // 3. 获取资源数据
        const resourcesResponse = await fetch(`http://localhost:8001/api/v1/factory/resources/${latestTask.id}`, {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (!resourcesResponse.ok) {
          throw new Error('获取资源失败');
        }

        currentData = await resourcesResponse.json();
        console.log('获取到的数据:', currentData);

        // 3. 渲染数据
        renderData();

        loading.style.display = 'none';
        container.style.display = 'block';

      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = '错误: ' + err.message;
      }
    }

    function renderData() {
      if (!currentData || currentData.length === 0) return;

      // 按类型分组
      const resources = {
        professor: currentData.find(r => r.agent_type === 'professor'),
        architect: currentData.find(r => r.agent_type === 'architect'),
        examiner: currentData.find(r => r.agent_type === 'examiner'),
        director: currentData.find(r => r.agent_type === 'director'),
        hacker: currentData.find(r => r.agent_type === 'hacker')
      };

      // 渲染教授文档
      if (resources.professor?.content) {
        document.getElementById('professorTitle').textContent = resources.professor.content.title;
        const sectionsHtml = resources.professor.content.sections.map(section => `
          <div class="resource-section">
            <h3>${section.heading}</h3>
            <p>${section.body}</p>
          </div>
        `).join('');
        document.getElementById('professorSections').innerHTML = sectionsHtml;
      }

      // 渲染思维导图
      if (resources.architect?.content?.mindmap) {
        document.getElementById('mindmapTitle').textContent = resources.architect.content.mindmap.root;
        const mindmapHtml = resources.architect.content.mindmap.children.map(branch => `
          <div class="resource-section">
            <h3>${branch.name}</h3>
            ${branch.children.map(sub => `
              <div style="margin-left: 20px;">
                <p style="color: #fbbf24;">• ${sub.name}</p>
                ${sub.children ? sub.children.map(child =>
                  `<p style="margin-left: 20px; color: #9ca3af;">- ${child.name}</p>`
                ).join('') : ''}
              </div>
            `).join('')}
          </div>
        `).join('');
        document.getElementById('mindmapContent').innerHTML = mindmapHtml;
      }

      // 渲染测验题目
      if (resources.examiner?.content?.questions) {
        const quizHtml = resources.examiner.content.questions.map((q, index) => `
          <div class="quiz-item">
            <div class="quiz-question">Q${index + 1}: ${q.question}</div>
            ${q.options.map((opt, oIdx) => `
              <div class="quiz-option">
                ${String.fromCharCode(65 + oIdx)}. ${opt}
                ${oIdx === q.answer ? ' ✅' : ''}
              </div>
            `).join('')}
            <div class="quiz-explanation">解析：${q.explanation}</div>
          </div>
        `).join('');
        document.getElementById('quizContent').innerHTML = quizHtml;
      }

      // 渲染视频资源
      if (resources.director?.content?.scenes) {
        const videoHtml = resources.director.content.scenes.map(scene => `
          <div class="resource-section">
            <h3>Scene ${scene.scene_number}: ${scene.title}</h3>
            <p><strong>视觉画面：</strong>${scene.visual}</p>
            <p><strong>解说：</strong>"${scene.voiceover}"</p>
            <div>
              <h4>相关视频：</h4>
              ${scene.resources.filter(r => r.type === 'video').map(video => `
                <div class="video-item">
                  <div class="video-info">
                    <h4>${video.title}</h4>
                    <p>${video.platform} • ${video.duration}</p>
                  </div>
                  <a href="${video.url}" target="_blank" class="video-link">观看</a>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
        document.getElementById('videoContent').innerHTML = videoHtml;
      }

      // 渲染代码实验
      if (resources.hacker?.content) {
        const code = resources.hacker.content;
        document.getElementById('codeTitle').textContent = code.title;
        document.getElementById('codeDescription').textContent = code.description;
        document.getElementById('codeContent').textContent = code.code;
        document.getElementById('codeOutput').textContent = code.expected_output;

        const exercisesHtml = code.exercises.map(ex =>
          `<li style="color: #e2e8f0; margin-bottom: 5px;">${ex}</li>`
        ).join('');
        document.getElementById('codeExercises').innerHTML = exercisesHtml;
      }
    }

    function showTab(tabName) {
      // 隐藏所有标签页
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });

      // 取消所有按钮的激活状态
      document.querySelectorAll('.tab-button').forEach(button => {
        button.classList.remove('active');
      });

      // 显示选中的标签页
      document.getElementById(tabName).classList.add('active');

      // 激活对应的按钮
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
