<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频资源测试</title>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .video-card {
      background-color: #141414;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .video-card:hover {
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
    }
    .video-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .video-scene {
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
    }
    .video-duration {
      color: #94a3b8;
      font-size: 14px;
    }
    .video-title {
      font-size: 18px;
      font-weight: 500;
      margin: 8px 0;
    }
    .video-content {
      padding: 20px;
    }
    .visual-desc {
      margin-bottom: 20px;
    }
    .visual-desc-title {
      color: #60a5fa;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .visual-desc-text {
      color: #cbd5e1;
      line-height: 1.6;
    }
    .voiceover {
      margin-bottom: 24px;
    }
    .voiceover-title {
      color: #60a5fa;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .voiceover-text {
      color: #94a3b8;
      font-style: italic;
      line-height: 1.6;
    }
    .video-resources {
      margin-top: 24px;
    }
    .video-resources-title {
      color: #60a5fa;
      font-size: 14px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .video-item {
      display: flex;
      gap: 16px;
      padding: 16px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .video-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .video-thumbnail {
      position: relative;
      flex-shrink: 0;
    }
    .video-thumbnail img {
      width: 192px;
      height: 128px;
      object-fit: cover;
      border-radius: 8px;
    }
    .video-thumbnail-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 8px;
    }
    .video-item:hover .video-thumbnail-overlay {
      opacity: 1;
    }
    .video-info {
      flex: 1;
    }
    .video-info-title {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 12px;
      color: white;
    }
    .video-meta {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }
    .video-platform {
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .video-duration-item {
      color: #94a3b8;
      font-size: 14px;
    }
    .video-description {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .video-button {
      background-color: transparent;
      border: 1px solid rgba(59, 130, 246, 0.5);
      color: #60a5fa;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .video-button:hover {
      background-color: rgba(59, 130, 246, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="margin-bottom: 24px;">视频资源测试页面</h1>

    <div id="video-container"></div>
  </div>

  <script>
    // 模拟后端返回的数据结构
    const mockData = {
      "scenes": [
        {
          "scene_number": 1,
          "title": "注意机制的本质",
          "visual": "动画展示注意力权重如何分布",
          "voiceover": "想象我们在读一个句子时，我们会自然地关注到与当前词最相关的词...",
          "duration_seconds": 45,
          "resources": [
            {
              "type": "video",
              "title": "Transformer注意力机制详解",
              "description": "深入理解Transformer架构中的核心机制",
              "thumbnail": "https://img.youtube.com/vi/eMlx5fFNoYc/maxresdefault.jpg",
              "url": "https://www.youtube.com/watch?v=eMlx5fFNoYc",
              "duration": "15:32",
              "platform": "B站"
            }
          ]
        },
        {
          "scene_number": 2,
          "title": "Query-Key-Value 直观理解",
          "visual": "三栏对比展示Q、K、V的作用",
          "voiceover": "Query就像是当前词的问题，Key是所有词的标签，Value是所有词的内容...",
          "duration_seconds": 60,
          "resources": [
            {
              "type": "video",
              "title": "QKV机制可视化教程",
              "description": "通过动画理解Query-Key-Value的工作原理",
              "thumbnail": "https://img.zcool.cn/community/03158e5d1b26e1a801215a95a458e7.jpg",
              "url": "https://www.bilibili.com/video/BV1v34y1x7h8",
              "duration": "12:45",
              "platform": "B站"
            }
          ]
        },
        {
          "scene_number": 3,
          "title": "多头注意力工作原理",
          "visual": "动画展示多个并行头的注意力计算",
          "voiceover": "每个头就像一个专家，从不同角度理解词之间的关系...",
          "duration_seconds": 75,
          "resources": [
            {
              "type": "video",
              "title": "多头注意力机制详解",
              "description": "深入理解多头注意力的并行计算原理",
              "thumbnail": "https://img.zcool.cn/community/03158e5d1b26e1a801215a95a458e7.jpg",
              "url": "https://www.bilibili.com/video/BV1v34y1x7h9",
              "duration": "18:20",
              "platform": "B站"
            }
          ]
        }
      ]
    };

    // 渲染视频列表
    function renderVideos() {
      const container = document.getElementById('video-container');

      mockData.scenes.forEach(scene => {
        const sceneCard = document.createElement('div');
        sceneCard.className = 'video-card';

        sceneCard.innerHTML = `
          <div class="video-header">
            <div>
              <div class="video-scene">Scene ${scene.scene_number}</div>
              <h2 class="video-title">${scene.title}</h2>
            </div>
            <div class="video-duration">${scene.duration_seconds}秒</div>
          </div>

          <div class="video-content">
            <div class="visual-desc">
              <div class="visual-desc-title">视觉画面：</div>
              <div class="visual-desc-text">${scene.visual}</div>
            </div>

            <div class="voiceover">
              <div class="voiceover-title">解说：</div>
              <div class="voiceover-text">"${scene.voiceover}"</div>
            </div>

            ${scene.resources && scene.resources.length > 0 ? `
              <div class="video-resources">
                <div class="video-resources-title">相关视频资源</div>
                ${scene.resources.map(video => `
                  <div class="video-item">
                    <div class="video-thumbnail">
                      <img src="${video.thumbnail}" alt="${video.title}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPHBhdGggZD0iTTggMTZWN0M1IDE5Ljc1IDIwLjY1IDUgMTYgNEM2IDI5LjIxIDAgNCAyLjIxIDRDNC44NSAxNiAxNCAxOS41NSAxNCAxNlYxNloiIGZpbGw9IiM0NDQ0NDQiLz4KPC9zdmc+'}">
                      <div class="video-thumbnail-overlay">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                      </div>
                    </div>
                    <div class="video-info">
                      <h3 class="video-info-title">${video.title}</h3>
                      <div class="video-meta">
                        <span class="video-platform">${video.platform}</span>
                        <span class="video-duration-item">${video.duration}</span>
                      </div>
                      <p class="video-description">${video.description}</p>
                      <button class="video-button" onclick="window.open('${video.url}', '_blank')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="M7 17L17 7"></path>
                          <path d="M7 7h10v10"></path>
                        </svg>
                        观看视频
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : `
              <div style="text-align: center; padding: 40px; color: #94a3b8;">
                暂无相关视频资源
              </div>
            `}
          </div>
        `;

        container.appendChild(sceneCard);
      });
    }

    // 页面加载完成后渲染
    document.addEventListener('DOMContentLoaded', renderVideos);
  </script>
</body>
</html>
