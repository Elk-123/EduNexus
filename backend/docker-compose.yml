# backend/docker-compose.yml
version: '3.8'

services:
  db:
    image: ankane/pgvector:latest # 使用带 pgvector 的镜像，为后续 RAG 做准备
    container_name: edunexus_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: edunexus_password
      POSTGRES_DB: edunexus
    ports:
      - "5433:5432"
    volumes:
      - edunexus_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: edunexus_redis
    ports:
      - "6379:6379"

volumes:
  edunexus_db_data: