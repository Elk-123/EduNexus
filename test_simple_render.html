<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简单渲染测试</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body {
      background-color: #0b0b0b;
      color: #e2e8f0;
      font-family: Inter, sans-serif;
      padding: 20px;
    }
    #chart {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <h1>简单渲染测试</h1>
  <button onclick="testRender()">渲染思维导图</button>
  <div id="chart">点击按钮测试</div>

  <script>
    // 初始化 mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
    });

    function testRender() {
      const container = document.getElementById('chart');
      container.innerHTML = '<p>正在渲染...</p>';

      const definition = `mindmap
  root((Transformer))
    ["核心概念"]
      ["Q - Query"]
      ["K - Key"]
      ["V - Value"]
    ["数学计算"]
      ["点积"]
      ["Softmax"]`;

      console.log('开始渲染...');

      mermaid.render('test-svg', definition)
        .then(result => {
          console.log('渲染成功!');
          console.log('结果类型:', typeof result);

          if (typeof result === 'object' && result.svg) {
            console.log('从 result.svg 获取内容');
            container.innerHTML = result.svg;
          } else if (typeof result === 'string') {
            console.log('直接使用结果字符串');
            container.innerHTML = result;
          } else {
            console.error('意外的结果类型:', typeof result);
            container.innerHTML = '<p style="color: red;">未知的结果类型: ' + typeof result + '</p>';
          }

          // 验证结果
          const svgElement = container.querySelector('svg');
          console.log('SVG元素是否存在:', !!svgElement);
          console.log('容器内容类型:', typeof container.innerHTML);
          console.log('容器内容长度:', container.innerHTML.length);
        })
        .catch(error => {
          console.error('渲染失败:', error);
          container.innerHTML = '<p style="color: red;">错误: ' + error.message + '</p>';
        });
    }
  </script>
</body>
</html>
