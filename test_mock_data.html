<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试内容工厂Mock数据</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0b0b0b;
      color: #e2e8f0;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background-color: #141414;
      border: 1px solid #303134;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .card h2 {
      margin-top: 0;
      color: #60a5fa;
    }
    .resource {
      border: 1px solid #303134;
      border-radius: 12px;
      padding: 16px;
      margin: 10px 0;
      background-color: #1a1a1a;
    }
    .resource h3 {
      color: #fbbf24;
      margin-top: 0;
    }
    .resource p {
      color: #9ca3af;
      margin: 8px 0;
    }
    .video {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
    }
    .code {
      background-color: #1e1e1e;
      border: 1px solid #303134;
      border-radius: 8px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      overflow-x: auto;
    }
    .quiz {
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 16px;
      margin: 8px 0;
    }
    .quiz-option {
      padding: 8px;
      margin: 4px 0;
      background-color: #334155;
      border-radius: 6px;
      cursor: pointer;
    }
    .quiz-option:hover {
      background-color: #475569;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #2563eb;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    .error {
      color: #ef4444;
      background-color: #7f1d1d;
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>EduNexus 内容工厂测试</h1>
  <p>测试显示 "Transformer 架构中的注意机制" 的 Mock 数据</p>

  <div class="card">
    <h2>1. 获取认证 token</h2>
    <button onclick="login()">登录 test@edunexus.com</button>
    <div id="loginResult"></div>
  </div>

  <div class="card">
    <h2>2. 获取 Mock 数据</h2>
    <button onclick="getMockData()">加载 Transformer 注意机制数据</button>
    <div id="mockDataResult" class="loading">点击按钮加载数据...</div>
  </div>

  <div id="resourcesDisplay" style="display: none;">
    <div class="card">
      <h2>教授文档</h2>
      <div id="professorContent" class="resource"></div>
    </div>

    <div class="card">
      <h2>思维导图</h2>
      <div id="mindmapContent" class="resource"></div>
    </div>

    <div class="card">
      <h2>测验题目</h2>
      <div id="quizContent" class="quiz"></div>
    </div>

    <div class="card">
      <h2>视频资源</h2>
      <div id="videoContent" class="resource"></div>
    </div>

    <div class="card">
      <h2>代码实验</h2>
      <div id="codeContent" class="code"></div>
    </div>
  </div>

  <script>
    let authToken = '';

    async function login() {
      try {
        const response = await fetch('http://localhost:8001/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: 'test@edunexus.com',
            password: '123456'
          })
        });

        const data = await response.json();
        if (response.ok) {
          authToken = data.access_token;
          document.getElementById('loginResult').innerHTML =
            `<div class="resource">✅ 登录成功！Token: ${authToken.substring(0, 20)}...</div>`;
        } else {
          document.getElementById('loginResult').innerHTML =
            `<div class="error">❌ 登录失败: ${data.detail}</div>`;
        }
      } catch (error) {
        document.getElementById('loginResult').innerHTML =
          `<div class="error">❌ 网络错误: ${error.message}</div>`;
      }
    }

    async function getMockData() {
      if (!authToken) {
        alert('请先登录！');
        return;
      }

      try {
        // 首先获取任务列表
        const tasksResponse = await fetch('http://localhost:8001/api/v1/factory/resources', {
          headers: {
            'Authorization': `Bearer ${authToken}`
          }
        });

        if (!tasksResponse.ok) {
          throw new Error('获取任务失败');
        }

        const resources = await tasksResponse.json();

        if (resources.length === 0) {
          document.getElementById('mockDataResult').innerHTML =
            '<div class="error">❌ 没有找到资源数据</div>';
          return;
        }

        // 显示所有资源
        displayResources(resources);
        document.getElementById('mockDataResult').style.display = 'none';
        document.getElementById('resourcesDisplay').style.display = 'block';

      } catch (error) {
        document.getElementById('mockDataResult').innerHTML =
          `<div class="error">❌ 获取数据失败: ${error.message}</div>`;
      }
    }

    function displayResources(resources) {
      // 教授文档
      const professorResource = resources.find(r => r.agent_type === 'professor');
      if (professorResource) {
        const content = professorResource.content;
        let html = `<h3>${content.title}</h3>`;
        content.sections.forEach(section => {
          html += `
            <h4>${section.heading}</h4>
            <p>${section.body}</p>
          `;
        });
        document.getElementById('professorContent').innerHTML = html;
      }

      // 思维导图
      const architectResource = resources.find(r => r.agent_type === 'architect');
      if (architectResource) {
        const mindmap = architectResource.content.mindmap;
        let html = `<h3>${mindmap.root}</h3>`;
        mindmap.children.forEach(branch => {
          html += `<h4>${branch.name}</h4>`;
          branch.children.forEach(sub => {
            html += `<p>• ${sub.name}</p>`;
            if (sub.children) {
              sub.children.forEach(child => {
                html += `<p style="margin-left: 20px;">- ${child.name}</p>`;
              });
            }
          });
        });
        document.getElementById('mindmapContent').innerHTML = html;
      }

      // 测验题目
      const examinerResource = resources.find(r => r.agent_type === 'examiner');
      if (examinerResource) {
        const quiz = examinerResource.content;
        let html = '';
        quiz.questions.forEach((question, index) => {
          html += `
            <div class="quiz">
              <h4>Q${index + 1}: ${question.question}</h4>
              ${question.options.map((opt, oIdx) => `
                <div class="quiz-option">
                  ${String.fromCharCode(65 + oIdx)}. ${opt}
                  ${oIdx === question.answer ? ' ✅' : ''}
                </div>
              `).join('')}
              <p style="color: #60a5fa; margin-top: 10px;">
                解析：${question.explanation}
              </p>
            </div>
          `;
        });
        document.getElementById('quizContent').innerHTML = html;
      }

      // 视频资源
      const directorResource = resources.find(r => r.agent_type === 'director');
      if (directorResource) {
        const scenes = directorResource.content.scenes;
        let html = '';
        scenes.forEach(scene => {
          html += `
            <div class="video">
              <h3>Scene ${scene.scene_number}: ${scene.title}</h3>
              <p>视觉画面：${scene.visual}</p>
              <p>"${scene.voiceover}"</p>
              <h4>相关视频：</h4>
              ${scene.resources.filter(r => r.type === 'video').map(video => `
                <div>
                  <strong>${video.title}</strong> (${video.platform} • ${video.duration})
                  <button onclick="window.open('${video.url}', '_blank')">观看</button>
                </div>
              `).join('')}
            </div>
          `;
        });
        document.getElementById('videoContent').innerHTML = html;
      }

      // 代码实验
      const hackerResource = resources.find(r => r.agent_type === 'hacker');
      if (hackerResource) {
        const lab = hackerResource.content;
        let html = `
          <h3>${lab.title}</h3>
          <p>${lab.description}</p>
          <h4>代码：</h4>
          <pre style="background: #0f172a; padding: 16px; border-radius: 8px; overflow-x: auto;">${lab.code}</pre>
          <h4>预期输出：</h4>
          <pre style="background: #0f172a; padding: 16px; border-radius: 8px; overflow-x: auto;">${lab.expected_output}</pre>
          <h4>扩展练习：</h4>
          <ul>
            ${lab.exercises.map(ex => `<li>${ex}</li>`).join('')}
          </ul>
        `;
        document.getElementById('codeContent').innerHTML = html;
      }
    }
  </script>
</body>
</html>
